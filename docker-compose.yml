name: todo-mysql

services:
  mysql:
    image: mysql:8.4
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASS}
      MYSQL_DATABASE: todo
      MYSQL_USER: ${MYSQL_USER}
      MYSQL_PASSWORD: ${MYSQL_PASS}
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 10

  app:
    image: destinyship/todo-app-mysql:latest
    ports:
      - "3081:3081"
    environment:
      PORT: 3081
      MYSQL_URL: mysql://${MYSQL_USER}:${MYSQL_PASS}@mysql:3306/todo
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data: