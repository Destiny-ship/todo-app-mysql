<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Destiny To Do List</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,800&family=Manrope:wght@400;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="page">

    <header class="topbar">
      <div class="brand">
        <span class="brand-name">DESTINY</span>
        <span class="brand-sub">TO DO LIST</span>
      </div>
      <p class="today" id="today"></p>
    </header>

    <section class="hero">
      <h1 id="greeting">Hello, Destiny</h1>
      <p class="hero-text" id="summary">Loading your tasks...</p>
    </section>

    <main class="layout">
      <section class="panel tasks-panel">
        <form id="task-form">
          <label for="task-input" class="sr-only">New task</label>
          <input type="text" id="task-input" placeholder="What needs doing?" required>
          <button type="submit" class="add-btn">Add task</button>
        </form>

        <div class="filters" role="group" aria-label="Filter tasks">
          <button type="button" class="filter active" data-filter="all">All</button>
          <button type="button" class="filter" data-filter="todo">To do</button>
          <button type="button" class="filter" data-filter="done">Done</button>
        </div>

        <ul id="task-list"></ul>
        <p class="empty" id="empty" hidden></p>
      </section>

      <aside class="panel progress-panel">
        <h2>Your progress</h2>
        <div class="ring" id="ring">
          <span id="percent">0%</span>
        </div>
        <dl class="stats">
          <div><dt>Total</dt><dd id="count-total">0</dd></div>
          <div><dt>Done</dt><dd id="count-done">0</dd></div>
          <div><dt>Left</dt><dd id="count-left">0</dd></div>
        </dl>
      </aside>
    </main>

    <footer class="footer">
      Built by Destiny with Node.js, Express and MongoDB
    </footer>

  </div>

  <script src="script.js"></script>
</body>
</html>
